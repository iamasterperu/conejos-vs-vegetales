  g.save();g.translate(x,y);
  if(o.rot)g.rotate(o.rot);
  if(o.a!==undefined)g.globalAlpha=o.a;
  const w=m[2]*sc,h=m[3]*sc;
  g.drawImage(IMG,m[0],m[1],m[2],m[3],-m[4]*sc,-m[5]*sc,w,h);
  if(o.tint){g.globalAlpha=(o.a===undefined?1:o.a)*o.tint[1];g.drawImage(tinted(name,o.tint[0]),0,0,m[2],m[3],-m[4]*sc,-m[5]*sc,w,h);}
  g.restore();
}
function shadow(x,y,r){g.fillStyle='rgba(0,20,0,.28)';g.beginPath();g.ellipse(x,y+2,r,r*.28,0,0,7);g.fill();}
function txt(s,x,y,size,fill,align,stroke,weight){
  g.font=(weight||700)+' '+size+'px '+FONT;g.textAlign=align||'center';g.textBaseline='middle';
  if(stroke){g.lineWidth=Math.max(3,size/7);g.strokeStyle=stroke;g.lineJoin='round';g.strokeText(s,x,y);}
  g.fillStyle=fill||'#fff';g.fillText(s,x,y);
}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ---------- animación (máquina de estados por personaje) ---------- */
function frameOf(def,e){
  const an=def.anim[e.st]||def.anim.idle;const n=an.f.length;
  let p=e.t*an.fps,fi=Math.floor(p),done=false;
  if(an.loop===false){if(fi>=n){fi=n-1;done=true;}}else fi%=n;
  return {name:nm(def.sp,an.f[fi]),fi,done,n,p};
}
function setState(e,st){e.st=st;e.t=0;e.ev=0;e.nextHit=undefined;}

/* ---------- utilidades de juego ---------- */
function say(t,s){banner=t;bannerT=s||2.6;}
function pushFx(o){o.t=0;fxs.push(o);}
function ring(x,y,r,col,life){pushFx({k:'ring',x,y,r,col,life:life||.4});}
function puff(x,y,n,col,spread){for(let i=0;i<n;i++)pushFx({k:'puff',x:x+rnd(-spread,spread),y:y+rnd(-spread*.4,spread*.4),vx:rnd(-40,40),vy:rnd(-60,-10),r:rnd(8,18),col,life:rnd(.35,.7)});}
function sparks(x,y,n,col){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(120,320);pushFx({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,col,life:rnd(.25,.5)});}}
function spriteFx(name,x,y,s0,s1,life,rot){pushFx({k:'sprite',name,x,y,s0,s1,life,rot:rot||0});}
function shake(t){shakeT=Math.max(shakeT,t);}

function dmgUnit(u,amt,fromE){
  if(u.dying)return;u.hp-=amt;u.hitT=.12;u.shake=.15;
  if(u.k==='jaula')sparks(u.x+rnd(-30,30),u.y-60,4,'#d9e4ff');
  if(u.hp<=0)killUnit(u);
}
function killUnit(u){
  u.dying=true;u.dt=0;grid[u.row][u.col]=null;
  if(u.k==='jaula'){
    for(let i=9;i<=22;i++){if(A[nm('jaula',i)]&&Math.random()<.8)pushFx({k:'debris',name:nm('jaula',i),x:u.x+rnd(-30,30),y:u.y-rnd(30,90),vx:rnd(-120,120),vy:rnd(-260,-60),rot:rnd(-3,3),life:1.2});}
    sparks(u.x,u.y-60,14,'#c9d6ff');puff(u.x,u.y-20,6,'rgba(190,190,200,',30);
  }else puff(u.x,u.y-30,5,'rgba(255,255,255,',24);
}
function dmgEnemy(e,amt,front,slow){
  if(e.dead)return;const d=ED[e.k];
  if(d.armor&&front)amt*=d.armor;
  e.hp-=amt;e.hitT=.12;if(slow)e.slowT=slow;
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.dead)return;e.dead=true;e.dt=0;e.t=0;e.st='death';kills++;
  const d=ED[e.k];
  if(d.boss){say('¡REY ZAPALLO DERROTADO!',4);shake(1);spriteFx('zapallo_02',e.x,e.y-40,.5,2.4,1.1);puff(e.x,e.y-50,16,'rgba(150,255,90,',80);}
  else if(e.k==='tomate')puff(e.x,e.y-30,6,'rgba(255,60,40,',20);
  else puff(e.x,e.y-30,5,'rgba(160,230,100,',20);
}
function enemyAt(r,x0){for(const e of enemies)if(!e.dead&&e.row===r&&e.x>x0-20&&e.x<W+10)return true;return false;}

function spawnEnemy(k,row,x){
  const d=ED[k];if(row===undefined){do{row=Math.floor(Math.random()*ROWS);}while(row===WV.lastRow&&Math.random()<.7);}
  WV.lastRow=row;
  const e={k,row,x:x===undefined?W+70:x,y:rowY(row),hp:d.hp,max:d.hp,st:'walk',t:rnd(0,1),ev:0,hitT:0,slowT:0,dead:false,dt:0,
    seed:Math.random()*6,sx:W+70,cdA:rnd(1,3),cdB:rnd(3,6),dash:0,spdMul:1,lunge:0};
  if(k==='zapallo'){e.cdA=4;e.phase=1;}
  enemies.push(e);return e;
}
function frontUnit(e,reach){
  let best=null;
  for(const u of units){if(u.row!==e.row||u.dying)continue;const dx=e.x-u.x;
    if(dx>-20&&dx<reach&&(!best||u.x>best.x))best=u;}
  return best;
}
function unitAhead(e,cells){
  let best=null;
  for(const u of units){if(u.row!==e.row||u.dying)continue;const dx=e.x-u.x;
    if(dx>0&&dx<cells*CWID&&(!best||u.x>best.x))best=u;}
  return best;
}

/* ---------- colocar conejos ---------- */
function place(i,r,c){
  const k=ORDER[i],d=UD[k];
  if(grid[r][c]||carrots<d.cost||cds[i]>0)return false;
  carrots-=d.cost;cds[i]=d.cd;
  const u={k,row:r,col:c,x:colX(c),y:rowY(r),hp:d.hp,max:d.hp,st:'idle',t:rnd(0,1),ev:0,hitT:0,shake:0,stun:0,cdT:d.rate?rnd(.2,.8):0,
    prodT:k==='granjero'?6:0,dying:false,dt:0,ph:rnd(0,6)};
  if(k==='huevo')setState(u,'special');
  grid[r][c]=u;units.push(u);
  puff(u.x,u.y,5,'rgba(120,80,40,',24);
  return true;
}

/* ---------- proyectiles ---------- */
function fireShot(u,kind){
  const d=UD[u.k],p=PJ[kind];
  projs.push({own:true,kind,row:u.row,x:u.x+d.mz[0],y:u.y+d.mz[1],d:0,delay:0,rot:0,dead:false});
}
function enemyShot(e,kind,delay,tx){
  const d=ED[e.k];
  projs.push({own:false,kind,row:e.row,x:e.x-60,y:d.fly?e.y-85:e.y-50,d:0,delay:delay||0,rot:0,dead:false,tx:tx});
}
function fallSpore(x,y){ // esporas del jefe: aterrizan en una celda
  projs.push({own:false,kind:'fall',x,y:y-520,gy:y-20,vy:0,row:Math.floor((y-GTOP)/RH),dead:false,delay:rnd(0,.7),life:0,rot:0});
  pushFx({k:'mark',x,y,life:1.3});
}
function updProj(p,dt){
  if(p.delay>0){p.delay-=dt;return;}
  if(p.kind==='fall'){
    p.vy+=1500*dt;p.y+=p.vy*dt;
    if(p.y>=p.gy){
      p.dead=true;ring(p.x,p.gy+10,70,'rgba(120,255,60,',.4);puff(p.x,p.gy,6,'rgba(110,200,60,',30);
      for(const u of units)if(!u.dying&&Math.abs(u.x-p.x)<CWID*.6&&Math.abs(u.y-(p.gy+20))<RH*.6)dmgUnit(u,60);
    }
    return;
  }
  if(p.own){
    const d=PJ[p.kind];p.x+=d.v*dt;p.d+=d.v*dt;
    p.arc=d.arc?d.arc*Math.sin(clamp(p.d/700,0,1)*Math.PI):0;
    p.rot+=(d.spin||0)*dt;
    if(p.x>W+60){p.dead=true;return;}
    for(const e of enemies){
      if(e.dead||e.row!==p.row)continue;
      if(p.x>e.x-ED[e.k].hw-8&&p.x<e.x+ED[e.k].hw){
        dmgEnemy(e,d.dmg,true,d.slow);p.dead=true;
        if(p.kind==='snow'){spriteFx('esquimal_09',p.x,p.y-p.arc,.35,.7,.35);sparks(p.x,p.y,6,'#bfe9ff');}
        else if(p.kind==='carrot'){sparks(p.x,p.y-p.arc,7,'#ff9a3c');}
        else if(p.kind==='bullet'){sparks(p.x,p.y,5,'#ffd34d');}
        else sparks(p.x,p.y-p.arc,4,'#ddd');
        break;
      }
    }
  }else{
    const v=p.kind==='grain'?520:430;
    p.x-=v*dt;p.d+=v*dt;
    if(p.kind==='spore'){p.y+=60*dt;}
    if(p.x<GX0-200){p.dead=true;return;}
    for(const u of units){
      if(u.dying||u.row!==p.row)continue;
      if(Math.abs(p.x-u.x)<42){dmgUnit(u,p.kind==='grain'?9:13);p.dead=true;sparks(p.x,p.y,4,p.kind==='grain'?'#ffd34d':'#9cff5a');break;}
    }
  }
}

/* ---------- conejos: lógica ---------- */
function updUnit(u,dt){
  const d=UD[u.k];
  if(u.dying){u.dt+=dt;return;}
  u.t+=dt;u.hitT=Math.max(0,u.hitT-dt);u.shake=Math.max(0,u.shake-dt);u.stun=Math.max(0,u.stun-dt);
  if(u.stun>0)return;
  if(u.k==='granjero'){
    u.prodT-=dt;
    if(u.prodT<=0){
      u.prodT=10;
      toks.push({kind:'basket',x:u.x+20,y:u.y-90,vx:rnd(25,55),vy:-340,ty:u.y-10,v:25,life:12,fly:0,rest:false});
      ring(u.x+10,u.y-80,50,'rgba(255,220,80,',.4);
    }
  }else if(d.shots){
    u.cdT-=dt;
    if(u.st==='idle'){if(u.cdT<=0&&enemyAt(u.row,u.x))setState(u,'attack');}
    else if(u.st==='attack'){
      const f=frameOf(d,u);
      while(u.ev<d.shots.length&&f.fi>=d.shots[u.ev].at){fireShot(u,d.shots[u.ev].kind);u.ev++;}
      if(f.done){setState(u,'idle');u.cdT=d.rate;}
    }
  }else if(u.k==='huevo'){
    if(u.t>=1.0)explodeEgg(u);
  }else if(u.k==='martillazo'){
    u.cdT-=dt;
    if(u.st==='idle'){
      if(u.cdT<=0){const t=hammerTarget(u);if(t){u.tgtE=t;setState(u,'windup');}}
    }else if(u.st==='windup'){
      if(frameOf(d,u).done){setState(u,'throw');
        const t=u.tgtE&&!u.tgtE.dead?u.tgtE:hammerTarget(u);
        const tx=t?clamp(t.x-ED[t.k].sp_*CWID*.9,u.x+40,W-40):u.x+CWID*3;
        projs.push({own:true,kind:'hammer',row:u.row,x:u.x+60,sx:u.x+60,tx,y:u.y-90,t:0,T:Math.max(.55,Math.abs(tx-u.x)/620),dead:false,delay:0,rot:0,src:u});
      }
    }else if(u.st==='throw'){
      if(u.t>.35)setState(u,'rec');
    }else if(u.st==='rec'){
      if(frameOf(d,u).done){setState(u,'idle');u.cdT=.4;}
    }
  }
}
function hammerTarget(u){
  let best=null;
  for(const e of enemies){if(e.dead||e.row!==u.row)continue;
    if(e.x>u.x+40&&e.x<u.x+UD.martillazo.range*CWID+60&&(!best||e.x<best.x))best=e;}
  return best;
}
function explodeEgg(u){
  const cx=u.x,cy=u.y-40;
  spriteFx('huevo_10',cx,u.y+14,.5,1.15,.55);
  spriteFx('huevo_09',cx,cy,.6,1.6,.35);
  for(const n of [11,12,13,14,15,16,17,18])pushFx({k:'sprite',name:nm('huevo',n),x:cx+rnd(-30,30),y:cy+rnd(-30,30),s0:1,s1:.4,life:.5,rot:0,vx:rnd(-380,380),vy:rnd(-380,-60)});
  ring(cx,u.y,150,'rgba(255,200,60,',.5);shake(.35);
  for(const e of enemies){
    if(e.dead)continue;
    const dx=e.x-cx,dy=(e.row-u.row)*RH;
    if(Math.hypot(dx,dy)<CWID*1.55)dmgEnemy(e,e.k==='zapallo'?260:1000,false);
  }
  u.dying=true;u.dt=0;u.egg=true;grid[u.row][u.col]=null;
}
function updHammer(p,dt){ // martillo gigante lanzado
  p.t+=dt;const k=clamp(p.t/p.T,0,1);
  p.x=p.sx+(p.tx-p.sx)*k;
  p.y=(p.src.y-90)*(1-k)+(rowY(p.row)-20)*k-Math.sin(k*Math.PI)*260;
  p.rot=k*Math.PI*3.2;
  if(k>=1){
    p.dead=true;
    spriteFx('huevo_10',p.tx,rowY(p.row)+6,.25,.55,.35);
    puff(p.tx,rowY(p.row),9,'rgba(140,100,60,',50);ring(p.tx,rowY(p.row),95,'rgba(255,230,160,',.35);shake(.22);
    for(const e of enemies){if(e.dead||e.row!==p.row)continue;
      if(Math.abs(e.x-p.tx)<ED[e.k].hw+78)dmgEnemy(e,e.k==='zapallo'?240:190,false);}
  }
}

/* ---------- vegetales: lógica ---------- */
function updEnemy(e,dt){
  const d=ED[e.k];
  if(e.dead){e.dt+=dt;e.t+=dt;if(e.dt>d.deathTime)e.remove=true;return;}
  e.t+=dt;e.hitT=Math.max(0,e.hitT-dt);e.slowT=Math.max(0,e.slowT-dt);e.cdA-=dt;e.cdB-=dt;
  let spd=d.sp_*CWID*(e.slowT>0?.5:1);
  const meleeTarget=d.reach>0&&!d.fly?frontUnit(e,d.reach):null;

  /* --- comportamientos especiales --- */
  if(e.k==='choclo'){
    const tg=unitAhead(e,d.range);
    if(e.st==='attack'){
      const f=frameOf(d,e);
      if(e.ev<1&&f.fi>=3){e.ev=1;enemyShot(e,'grain',0);enemyShot(e,'grain',.13);enemyShot(e,'grain',.26);}
      if(f.done){setState(e,'idle');e.cdA=2.6;}
      return;
    }
    if(tg){if(e.st!=='idle')setState(e,'idle');if(e.cdA<=0)setState(e,'attack');return;}
    if(e.st!=='walk')setState(e,'walk');
    e.x-=spd*dt;
  }
  else if(e.k==='lechuga'){
    const tg=unitAhead(e,d.range);
    if(e.st==='attack'){
      const f=frameOf(d,e);
      if(e.ev<1&&e.t>.4){e.ev=1;enemyShot(e,'spore',0);enemyShot(e,'spore',.16);enemyShot(e,'spore',.32);}
      if(e.t>1.1){setState(e,'walk');e.cdA=4;}
      return;
    }
    if(tg&&e.cdA<=0)setState(e,'attack');
    else{if(e.st!=='walk')setState(e,'walk');e.x-=spd*dt;}
  }
  else if(e.k==='cebolla'){
    const near=unitAhead(e,d.gasRange);
    if(e.st==='special'){
      if(e.ev<1&&e.t>1.0){
        e.ev=1;fxGas(e.x-30,e.y);
      }
      if(e.t>1.3){setState(e,'idle');e.cdB=5;}
      return;
    }
    if(near||meleeTarget){
      if(e.st!=='idle')setState(e,'idle');
      if(e.cdB<=0)setState(e,'special');
      return;
    }
    if(e.st!=='walk')setState(e,'walk');
    e.x-=spd*dt;
  }
  else if(e.k==='tomate'){
    if(e.st==='ignite'){
      if(e.t>.6)explodeTomato(e);
      return;
    }
    if(meleeTarget){setState(e,'ignite');return;}
    e.spdMul=1+clamp((W+70-e.x)/(CWID*7),0,1.2);
    e.x-=spd*e.spdMul*dt;
  }
  else if(e.k==='aji'){
    if(meleeTarget){
      if(e.st!=='attack')setState(e,'attack');
      const an=d.anim.attack,n=an.f.length,p=e.t*an.fps;
      if(e.nextHit===undefined)e.nextHit=d.hitIdx;
      if(p>=e.nextHit){dmgUnit(meleeTarget,d.dmg);e.nextHit+=n;e.x+=18;}
    }else{
      e.dash-=dt;
      if(e.dash<=0&&e.cdB<=0){e.dash=.8;e.cdB=rnd(3.5,5.5);setState(e,'dash');}
      if(e.dash>0){e.x-=spd*2.5*dt;}
      else{if(e.st!=='walk')setState(e,'walk');e.x-=spd*dt;}
    }
  }
  else if(e.k==='brocoli'){
    if(e.st==='special'){
      if(e.ev<1&&e.t>.7){e.ev=1;shockwave(e,2.3,45,2);}
      if(e.t>1.3){setState(e,'walk');e.cdB=10;}
      return;
    }
    if(meleeTarget){
      if(e.cdB<=0){setState(e,'special');return;}
      if(e.st!=='attack')setState(e,'attack');
      const an=d.anim.attack,n=an.f.length,p=e.t*an.fps;
      if(e.nextHit===undefined)e.nextHit=d.hitIdx;
      if(p>=e.nextHit){dmgUnit(meleeTarget,d.dmg);e.nextHit+=n;puff(meleeTarget.x+30,e.y,4,'rgba(130,100,60,',22);shake(.1);}
    }else{if(e.st!=='walk')setState(e,'walk');e.x-=spd*dt;}
  }
  else if(e.k==='zapallo'){bossAI(e,dt,spd,meleeTarget);}
  else{ /* papa, beterraga: cuerpo a cuerpo */
    if(meleeTarget){
      if(e.st!=='attack')setState(e,'attack');
      const an=d.anim.attack,n=an.f.length,p=e.t*an.fps;
      if(e.nextHit===undefined)e.nextHit=d.hitIdx;
      if(p>=e.nextHit){dmgUnit(meleeTarget,d.dmg);e.nextHit+=n;if(e.k==='beterraga')e.x+=12;}
    }else{if(e.st!=='walk')setState(e,'walk');e.x-=spd*dt;}
  }

  /* --- bola de alambre / zanahorias --- */
  const w=wire[e.row];
  if(e.x-d.hw*.6<GX0-10&&w.st==='idle'){w.st='roll';w.hit=new Set();say('¡Bola de alambre!',1.2);}
  if(e.x<150&&S==='play'){S='lose';lockUntil=Date.now()+900;}
}
function fxGas(x,y){
  fxs.push({k:'gas',x,y,t:0,life:4.2,row:Math.floor((y-FOOT-GTOP)/RH),done:0});
}
function explodeTomato(e){
  e.dead=true;e.dt=0;e.t=0;e.st='death';e.exploded=true;kills++;
  const cx=e.x,cy=e.y-40;
  spriteFx('huevo_10',cx,e.y+10,.4,.9,.5);spriteFx('aji_00',cx,cy,.5,1.2,.45);ring(cx,e.y,140,'rgba(255,90,50,',.45);shake(.3);
  for(const u of units){
    if(u.dying)continue;
    if(Math.hypot(u.x-cx,(u.row-e.row)*RH)<CWID*1.3)dmgUnit(u,190);
  }
}
function shockwave(e,cells,dmg,stun){
  const cx=e.x-40;
  ring(cx,e.y,cells*CWID*.8,'rgba(255,240,180,',.6);ring(cx,e.y,cells*CWID*.5,'rgba(255,180,90,',.45);puff(cx,e.y,10,'rgba(150,110,60,',70);shake(.4);
  for(const u of units){
    if(u.dying)continue;
    if(Math.abs(u.row-e.row)<=1&&Math.abs(u.x-cx)<cells*CWID){dmgUnit(u,dmg);u.stun=Math.max(u.stun,stun);}
  }
}
function bossAI(e,dt,spd,tgt){
  const d=ED.zapallo;const rage=e.hp<d.hp*.5;
  if(rage&&e.phase===1){e.phase=2;say('¡REY ZAPALLO ENFURECIDO!',3);shake(.6);e.cdA=1.2;}
  const sp=spd*(rage?1.6:1),cd=rage?3:5;
  if(e.st==='attack'){
    if(e.ev<1&&e.t>.55){e.ev=1;shockwave(e,2.6,110,1.6);}
    if(e.t>1.1){setState(e,'walk');e.cdB=rage?1.6:2.4;}return;
  }
  if(e.st==='spores'){
    if(e.ev<1&&e.t>.6){e.ev=1;spriteFx('zapallo_02',e.x-70,e.y-70,.4,1.2,.5);
      const n=rage?8:5;for(let i=0;i<n;i++){fallSpore(colX(Math.floor(rnd(0,COLS-.01))),rowY(Math.floor(rnd(0,ROWS))));}}
    if(e.t>1.3){setState(e,'walk');e.cdA=cd;}return;
  }
  if(e.st==='summon'){
    if(e.ev<1&&e.t>.8){e.ev=1;
      const pool=['papa','aji','choclo','beterraga','tomate'];const n=rage?3:2;
      for(let i=0;i<n;i++){const k=pool[Math.floor(Math.random()*pool.length)];const row=clamp(e.row+Math.floor(rnd(-2,3)),0,ROWS-1);
        const s=spawnEnemy(k,row,e.x-rnd(20,160));s.cdA=2;puff(s.x,s.y-30,6,'rgba(110,230,70,',30);}
      ring(e.x-40,e.y,170,'rgba(110,255,80,',.6);}
    if(e.t>1.6){setState(e,'walk');e.cdA=cd+1;}return;
  }
  if(tgt&&e.cdB<=0){setState(e,'attack');return;}
  if(e.cdA<=0){setState(e,Math.random()<.5?'spores':'summon');return;}
  if(e.st!=='walk')setState(e,'walk');
  if(!tgt)e.x-=sp*dt;
}

/* ---------- oleadas ---------- */
const BOSS_T=190;
function pickEnemy(t){
  const r=Math.random();
  if(t<35)return 'papa';
  if(t<65)return r<.65?'papa':'choclo';
  if(t<100)return r<.3?'papa':r<.5?'choclo':r<.75?'aji':'tomate';
  if(t<140)return r<.2?'papa':r<.35?'choclo':r<.5?'aji':r<.65?'tomate':r<.82?'beterraga':'cebolla';
  return r<.12?'papa':r<.24?'choclo':r<.36?'aji':r<.48?'tomate':r<.62?'beterraga':r<.76?'cebolla':r<.94?'lechuga':'brocoli';
}
function bigWave(list){say('¡OLEADA GRANDE!',3);shake(.3);list.forEach((k,i)=>WV.q.push({at:TG+i*.65,k}));}
function updWaves(dt){
  TG+=dt;
  WV.skyT-=dt;
  WV.q=WV.q.filter(o=>{if(TG>=o.at){spawnEnemy(o.k);return false;}return true;});
  if(WV.skyT<=0){WV.skyT=rnd(7.5,10.5);toks.push({kind:'sky',x:rnd(GX0+60,GX0+COLS*CWID-60),y:-40,ty:rnd(GTOP+90,GTOP+RH*ROWS-60),vx:0,vy:0,v:25,life:13,fly:0,rest:false});}
  if(!WV.boss){
    WV.next-=dt;
    if(WV.next<=0){spawnEnemy(pickEnemy(TG));WV.next=Math.max(3.4,10-TG*.032)*rnd(.75,1.25);}
    if(!WV.big[0]&&TG>=95){WV.big[0]=true;bigWave(['papa','choclo','aji','tomate','papa']);}
    if(!WV.big[1]&&TG>=150){WV.big[1]=true;bigWave(['beterraga','cebolla','brocoli','aji','lechuga','tomate','choclo','papa']);}
    if(TG>=BOSS_T){WV.boss=true;WV.bossRef=spawnEnemy('zapallo',2);say('¡LLEGA EL REY ZAPALLO!',4);shake(.8);WV.next=9;}
  }else{
    WV.next-=dt;
    if(WV.next<=0&&WV.bossRef&&!WV.bossRef.dead){spawnEnemy(["papa","aji","choclo"][Math.floor(Math.random()*3)]);WV.next=15;}
  }
}

/* ---------- bola de alambre ---------- */
function updWire(dt){
  wire.forEach((w,r)=>{
    if(w.st!=='roll')return;
    const sp=640;w.x+=sp*dt;w.rot+=sp*dt/46;
    for(const e of enemies){
      if(e.dead||e.row!==r||w.hit.has(e))continue;
      if(Math.abs(e.x-w.x)<ED[e.k].hw+55){
        w.hit.add(e);
        dmgEnemy(e,ED[e.k].boss?900:99999,false);
        sparks(w.x+40,e.y-40,9,'#e4e8f0');shake(.15);
      }
    }
    if(w.x>W+120)w.st='gone';
  });
}

/* ---------- fichas ---------- */
const CARD={x0:190,w:130,h:112,gap:8,y:14};
function cardRect(i){return {x:CARD.x0+i*(CARD.w+CARD.gap),y:CARD.y,w:CARD.w,h:CARD.h};}
function pointer(x,y){
  if(S==='menu'){if(Date.now()>lockUntil)reset();return;}
  if(S==='win'||S==='lose'){if(Date.now()>=lockUntil)reset();return;}
  if(S!=='play')return;
  // zanahorias flotantes
  for(let i=toks.length-1;i>=0;i--){
    const t=toks[i];if(t.fly)continue;
    if(Math.hypot(x-t.x,y-t.y)<48){t.fly=.001;t.fx=t.x;t.fy=t.y;return;}
  }
  // fichas
  for(let i=0;i<ORDER.length;i++){
    const r=cardRect(i);
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){
      const d=UD[ORDER[i]];
      if(cds[i]<=0&&carrots>=d.cost)sel=(sel===i?null:i);
      return;
    }
  }
  const c=Math.floor((x-GX0)/CWID),r=Math.floor((y-GTOP)/RH);
  if(sel!==null&&c>=0&&c<COLS&&r>=0&&r<ROWS){place(sel,r,c);}
  sel=null;
}
C.addEventListener('pointerdown',e=>{e.preventDefault();const p=toL(e);mouse=p;pointer(p.x,p.y);});
C.addEventListener('pointermove',e=>{mouse=toL(e);});
function toL(e){const r=C.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
window.addEventListener('keydown',e=>{
  if(S!=='play')return;
  if(e.key==='Escape'){sel=null;return;}
  const i=parseInt(e.key,10)-1;
  if(i>=0&&i<ORDER.length&&cds[i]<=0&&carrots>=UD[ORDER[i]].cost)sel=(sel===i?null:i);
});

/* ---------- update general ---------- */
function update(dt){
  if(S==='menu'||S==='loading'){TG+=dt;return;}
  if(S!=='play'){fxs.forEach(f=>f.t+=dt);return;}
  cds=cds.map(c=>Math.max(0,c-dt));
  if(hint>0)hint-=dt;
  if(bannerT>0)bannerT-=dt;
  if(shakeT>0)shakeT-=dt;
  updWaves(dt);
  units.forEach(u=>updUnit(u,dt));
  enemies.forEach(e=>updEnemy(e,dt));
  projs.forEach(p=>p.kind==='hammer'?updHammer(p,dt):updProj(p,dt));
  updWire(dt);
  // zanahorias
  toks.forEach(t=>{
    t.life-=dt;
    if(t.fly){
      t.fly+=dt*2.2;const k=clamp(t.fly,0,1),e=k*k*(3-2*k);
      t.x=t.fx+(95-t.fx)*e;t.y=t.fy+(66-t.fy)*e;
      if(k>=1){carrots+=t.v;t.done=true;}
    }else if(t.kind==='basket'){
      t.vy+=900*dt;t.x+=t.vx*dt;t.y+=t.vy*dt;
      if(t.y>=t.ty&&t.vy>0){t.y=t.ty;t.vy=0;t.vx=0;}
    }else{
      if(t.y<t.ty)t.y=Math.min(t.ty,t.y+80*dt);
    }
  });
  toks=toks.filter(t=>!t.done&&(t.fly||t.life>0));
  // gas
  fxs.forEach(f=>{
    f.t+=dt;
    if(f.k==='gas'){
      f.done+=dt;
      if(f.done>=.5){f.done=0;
        for(const u of units){if(u.dying)continue;
          if(Math.abs(u.row-f.row)<=1&&Math.abs(u.x-f.x)<CWID*1.5)dmgUnit(u,7);}
      }
    }else if(f.k==='puff'||f.k==='spark'||f.k==='debris'||(f.k==='sprite'&&f.vx!==undefined)){
      f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt;
      if(f.k==='spark'||f.k==='debris'||f.k==='sprite')f.vy=(f.vy||0)+(f.k==='puff'?0:700)*dt;
    }
  });
  fxs=fxs.filter(f=>f.t<f.life);
  projs=projs.filter(p=>!p.dead);
  units=units.filter(u=>!(u.dying&&u.dt>.01)||false);
  enemies=enemies.filter(e=>!e.remove);
  // victoria
  if(WV.boss&&WV.bossRef&&WV.bossRef.dead&&WV.bossRef.dt>2.4&&S==='play'){S='win';lockUntil=Date.now()+900;}
}

/* ============================ DIBUJO ============================ */
function drawUnit(u){
  const d=UD[u.k];
  if(u.dying)return;
  const fr=frameOf(d,u);
  let ox=0;
  if(u.shake>0)ox=(Math.random()-.5)*7;
  if(u.k==='huevo')ox=(Math.random()-.5)*(3+u.t*8);
  const stun=u.stun>0;
  shadow(u.x,u.y,u.k==='jaula'?58:46);
  let tint=null;
  if(u.hitT>0)tint=['#ffffff',.5];
  else if(stun)tint=['#9aa6ff',.35];
  else if(u.k==='huevo'&&u.t>.3&&Math.floor(u.t*14)%2)tint=['#ff5a3a',.5];
  let sy=1;
  if(u.k==='granjero'&&u.prodT<1)sy=1+Math.sin(u.prodT*Math.PI*8)*.03;
  spr(fr.name,u.x+ox,u.y,d.sc*sy,{tint});
  if(u.k==='granjero'&&u.prodT<1.0){
    g.save();g.globalAlpha=.45*(1-u.prodT);g.fillStyle='#ffe066';g.beginPath();g.arc(u.x-30,u.y-62,34,0,7);g.fill();g.restore();
  }
  if(u.hp<u.max){hpBar(u.x,u.y-(u.k==='jaula'?128:136),u.hp/u.max);}
  if(stun){txt('✦',u.x,u.y-150,28,'#c6d0ff');}
}
function hpBar(x,y,k){
  g.fillStyle='rgba(0,0,0,.55)';rr(x-24,y,48,8,4);g.fill();
  g.fillStyle=k>.5?'#69db4f':k>.25?'#f5c93b':'#ef4a3a';rr(x-23,y+1,Math.max(2,46*k),6,3);g.fill();
}
function drawEnemy(e){
  const d=ED[e.k];
  let y=e.y,x=e.x;
  if(e.dead){
    if(e.exploded)return;
    const fadeStart=d.deathTime*.55;
    const a=clamp(1-(e.dt-fadeStart)/(d.deathTime-fadeStart),0,1);
    shadow(x,y,40*d.sc*.8);
    if(d.anim.death){
      const fr=frameOf(d,{st:'death',t:e.dt});
      spr(fr.name,x,y,d.sc,{a});
    }else spr(nm(d.sp,d.anim.walk.f[0]),x,y,d.sc,{a});
    return;
  }
  const fr=frameOf(d,e);
  const bob=Math.sin(TG*8+e.seed)*(d.fly?7:2);
  let off=0;
  if(d.fly){off=-62;shadow(x,y,34*d.sc*.8);}
  else shadow(x,y,(d.boss?110:d.sc*30)+(e.k==='tomate'?8:0));
  let tint=null;
  if(e.hitT>0)tint=['#ffffff',.55];
  else if(e.slowT>0)tint=['#7fd0ff',.38];
  else if(e.k==='zapallo'&&e.phase===2)tint=['#ff3b2a',.22+.12*Math.sin(TG*9)];
  else if(e.st==='ignite'&&Math.floor(e.t*16)%2)tint=['#ffe14d',.5];
  let sx=x,sc=d.sc;
  if(e.k==='tomate'&&e.st==='walk'){ /* rueda */ }
  spr(fr.name,sx,y+bob+off,sc,{tint});
  if(e.slowT>0&&A.esquimal_11){spr('esquimal_11',x,y+6,.38,{a:.8});}
  if(e.hp<e.max){const w=d.boss?1:0;hpBar(x,y-(d.boss?260:d.sc*86)-(d.fly?60:0),e.hp/e.max);}
}
function drawProj(p){
  if(p.delay>0)return;
  if(p.kind==='hammer'){
    g.save();g.translate(p.x,p.y);g.rotate(p.rot);
    // martillo gigante de madera
    g.fillStyle='#8a5a2b';rr(-5,-6,12,92,4);g.fill();
    const gr=g.createLinearGradient(-44,0,44,0);gr.addColorStop(0,'#a8692c');gr.addColorStop(.5,'#d4934a');gr.addColorStop(1,'#8d561f');
    g.fillStyle=gr;rr(-46,-52,92,58,12);g.fill();g.strokeStyle='#5a3414';g.lineWidth=4;g.stroke();
    g.fillStyle='rgba(60,30,10,.55)';g.fillRect(-46,-36,92,5);g.fillRect(-46,-14,92,5);
    g.restore();return;
  }
  if(p.kind==='fall'){
    spr('lechuga_06',p.x,p.y,1.2,{a:.95});return;
  }
  if(p.own){
    const d=PJ[p.kind];shadow(p.x,rowY(p.row)-6,12);
    spr(d.sp,p.x,p.y-(p.arc||0),d.sc,{rot:p.rot});
  }else{
    if(p.kind==='grain')spr(p.d%40<20?'choclo_03':'choclo_04',p.x,p.y,1.1);
    else spr('lechuga_0'+(2+Math.floor(p.d/30)%3),p.x,p.y,.9);
  }
}
function drawFx(f){
  const k=f.t/f.life;
  if(f.k==='ring'){g.strokeStyle=f.col+(1-k)+')';g.lineWidth=10*(1-k)+2;g.beginPath();g.ellipse(f.x,f.y,f.r*k,f.r*k*.4,0,0,7);g.stroke();}
  else if(f.k==='puff'){g.fillStyle=f.col+(.5*(1-k))+')';g.beginPath();g.arc(f.x,f.y,f.r*(1+k),0,7);g.fill();}
  else if(f.k==='spark'){g.fillStyle=f.col;g.globalAlpha=1-k;g.beginPath();g.arc(f.x,f.y,3.2,0,7);g.fill();g.globalAlpha=1;}
  else if(f.k==='sprite'){spr(f.name,f.x,f.y,f.s0+(f.s1-f.s0)*k,{a:1-k*k,rot:f.rot*k});}
  else if(f.k==='debris'){spr(f.name,f.x,f.y,.55,{a:1-k*k,rot:f.rot*f.t});}
  else if(f.k==='mark'){g.strokeStyle='rgba(120,255,60,'+(.8*(1-k*.5))+')';g.lineWidth=5;g.beginPath();g.ellipse(f.x,f.y,48*(1-k*.4),19*(1-k*.4),0,0,7);g.stroke();}
  else if(f.k==='gas'){
    const a=Math.min(1,f.t*2.5)*Math.min(1,(f.life-f.t)*1.2);
    for(let i=0;i<7;i++){
      const ang=i*1.1+f.t*.8,rx=Math.cos(ang)*CWID*.8*(i%3)/2.2,ry=Math.sin(ang)*30;
      g.fillStyle='rgba(130,225,40,'+(.28*a)+')';g.beginPath();g.ellipse(f.x+rx,f.y-45+ry,74,48,0,0,7);g.fill();
    }
    if(A.cebolla_02)spr('cebolla_02',f.x+Math.sin(f.t*3)*20,f.y-55,2.6,{a:.55*a});
  }
}
function drawTok(t){
  const a=t.fly?1:(t.life<3?(.55+.45*Math.sin(t.life*10)):1);
  if(t.kind==='basket'){
    g.save();g.globalAlpha=.35*a;g.fillStyle='#ffe066';g.beginPath();g.arc(t.x,t.y-24,44+Math.sin(TG*6)*3,0,7);g.fill();g.restore();
    spr('granjero_15',t.x,t.y,.95,{a});
  }else{

function draw(){
  g.clearRect(0,0,W,H);
  g.save();
  if(shakeT>0&&S==='play')g.translate(rnd(-6,6)*Math.min(1,shakeT*2),rnd(-5,5)*Math.min(1,shakeT*2));
  if(BGI.complete&&BGI.naturalWidth)g.drawImage(BGI,0,0,W,H);else{g.fillStyle='#2f8f2f';g.fillRect(0,0,W,H);}
  if(S==='loading'){
    g.restore();
    txt('Cargando...',W/2,H/2,50,'#fff','center','#143');
    if(loaded>=2&&IMG.naturalWidth){S='menu';TG=0;}
    return;
  }
  if(S==='menu'){drawMenu();g.restore();return;}
  drawWire();
  // personajes ordenados por fila
  const list=[];
  units.forEach(u=>list.push({y:u.y,f:()=>drawUnit(u)}));
  enemies.forEach(e=>list.push({y:e.y+(ED[e.k].fly?200:0)+(e.dead?-60:0),f:()=>drawEnemy(e)}));
  list.sort((a,b)=>a.y-b.y);
  list.forEach(o=>o.f());
  fxs.filter(f=>f.k==='gas').forEach(drawFx);
  projs.forEach(drawProj);
  fxs.filter(f=>f.k!=='gas').forEach(drawFx);
  toks.forEach(drawTok);
  drawGhost();
  g.restore();
  drawHUD();
  drawBanner();
  if(hint>0&&S==='play'){
    g.save();g.globalAlpha=clamp(hint/2,0,1);
    txt('Toca las zanahorias 🥕, elige un conejo y colócalo en el huerto',W/2,GTOP+RH*ROWS+70,30,'#fff','center','#2b4a12');g.restore();
  }
  if(S==='win'||S==='lose')drawEnd();
}

let last=0;
function frame(ts){
  const dt=Math.min(1/20,(ts-last)/1000||0);last=ts;
  update(dt);draw();
  requestAnimationFrame(frame);
}

  get units(){return units},get enemies(){return enemies},get wire(){return wire},set TG(v){TG=v},get toks(){return toks},ORDER,UD,ED,

try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window)navigator.serviceWorker.register('sw.js');}catch(e){}
/* ---------- pantalla completa ---------- */
(function(){
  const b=document.getElementById('fs'),el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  const ex=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
  const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
  if(standalone){b.style.display='none';return;}
  if(!req){
    const o=document.getElementById('ios');
    b.addEventListener('click',e=>{e.stopPropagation();o.style.display='flex';});
    b.addEventListener('pointerdown',e=>e.stopPropagation());
    document.getElementById('iosx').addEventListener('click',()=>{o.style.display='none';});
    return;
  }
  const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  function toggle(){
    try{
      if(!isFS()){
        const p=req.call(el);
        const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(e){}};
        if(p&&p.then)p.then(lock).catch(()=>{});else lock();
      }else{ex.call(document);}
    }catch(e){}
  }
  function upd(){b.textContent=isFS()?'✕':'⛶';}
  b.addEventListener('click',e=>{e.stopPropagation();toggle();});
  b.addEventListener('pointerdown',e=>e.stopPropagation());
  document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd);
  addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')toggle();});
})();
</script>
