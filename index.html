  g.font=(weight||500)+' '+size+'px '+FONT;const words=s.split(' ');const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}

  const ls=wrap(s,maxW,size,weight);ls.forEach((l,i)=>txt(l,x,y+i*lh,size,fill,align,stroke,weight||500));return ls.length;
}

  enemies.push(e);return e;
}
function frontUnit(e,reach){
  let best=null;
  for(const u of units){if(u.row!==e.row||u.dying||u.under||u.away)continue;const dx=e.x-u.x;
    if(dx>-20&&dx<reach&&(!best||u.x>best.x))best=u;}
  return best;
}
function unitAhead(e,cells){
  let best=null;
  for(const u of units){if(u.row!==e.row||u.dying||u.under||u.away)continue;const dx=e.x-u.x;
    if(dx>0&&dx<cells*CWID&&(!best||u.x>best.x))best=u;}
  return best;
}

/* ---------- colocar conejos ---------- */
function place(i,r,c){
  const k=ORDER[i],d=UD[k];
  if(i>=nUnlocked()||grid[r][c]||carrots<d.cost||cds[i]>0)return false;
  carrots-=d.cost;cds[i]=d.cd;
  const u={k,row:r,col:c,x:colX(c),y:rowY(r),hp:d.hp,max:d.hp,st:'idle',t:rnd(0,1),ev:0,hitT:0,shake:0,stun:0,cdT:d.rate?rnd(.2,.8):(k==='cavador'||k==='ninja'?1:0),
    prodT:k==='granjero'?6:k==='chef'?5:k==='ingeniero'?1.5:0,dying:false,dt:0,ox:0,oy:0,flip:false,traps:0};
  if(k==='huevo')setState(u,'special');
  if(tut){if(k==='granjero')tut.g=true;if(k==='resortero'){tut.r=true;tut.row=r;}if(k==='jaula')tut.j=true;}
  grid[r][c]=u;units.push(u);
  puff(u.x,u.y,5,'rgba(120,80,40,',24);
  return true;
}

/* ---------- proyectiles ---------- */
function fireShot(u,kind){
  const d=UD[u.k];
  projs.push({own:true,kind,row:u.row,x:u.x+d.mz[0],y:u.y+d.mz[1],d:0,delay:0,rot:0,dead:false});
}
function topEnemy(){ // el vegetal con más vida visible
  let b=null;for(const e of enemies){if(e.dead||e.x>W-30)continue;if(!b||e.hp>b.hp)b=e;}return b;
}
function enemyShot(e,kind,delay){
  const d=ED[e.k];
  projs.push({own:false,kind,row:e.row,x:e.x-60,y:d.fly?e.y-85:e.y-50,d:0,delay:delay||0,rot:0,dead:false});
}
function fallSpore(x,y){
  projs.push({own:false,kind:'fall',x,y:y-520,gy:y-20,vy:0,row:rowAt(y),dead:false,delay:rnd(0,.7),life:0,rot:0});
  pushFx({k:'mark',x,y,life:1.3});
}
function updProj(p,dt){
  if(p.delay>0){p.delay-=dt;return;}
  if(p.kind==='fall'){
    p.vy+=1500*dt;p.y+=p.vy*dt;
    if(p.y>=p.gy){
      p.dead=true;ring(p.x,p.gy+10,70,'rgba(120,255,60,',.4);puff(p.x,p.gy,6,'rgba(110,200,60,',30);
      for(const u of units)if(!u.dying&&Math.abs(u.x-p.x)<CWID*.6&&Math.abs(u.y-(p.gy+20))<RH*.6)dmgUnit(u,60);
    }
    return;
  }
  if(p.kind==='bee'){
    const t=p.tg;
    if(!t||t.dead){p.tg=topEnemy();if(!p.tg){p.dead=true;return;}}
    const tx=p.tg.x,ty=p.tg.y-50,dx=tx-p.x,dy=ty-p.y,dist=Math.hypot(dx,dy)||1;
    p.t=(p.t||0)+dt;const sp=Math.min(560,200+p.t*700);
    p.x+=dx/dist*sp*dt+Math.sin(p.t*18+p.ph)*40*dt;p.y+=dy/dist*sp*dt+Math.cos(p.t*15+p.ph)*40*dt;p.rot=Math.atan2(dy,dx)*0;
    if(dist<ED[p.tg.k].hw+16){dmgEnemy(p.tg,32,false);p.dead=true;sparks(p.x,p.y,5,'#ffd34d');}
    return;
  }
  if(p.own){
    const d=PJ[p.kind];p.x+=d.v*dt;p.d+=d.v*dt;
    p.arc=d.arc?d.arc*Math.sin(clamp(p.d/700,0,1)*Math.PI):0;
    p.rot+=(d.spin||0)*dt;
    if(p.x>W+60){p.dead=true;return;}
    for(const e of enemies){
      if(e.dead||e.row!==p.row)continue;
      if(p.x>e.x-ED[e.k].hw-8&&p.x<e.x+ED[e.k].hw){
        dmgEnemy(e,d.dmg,true,d.slow);p.dead=true;
        if(p.kind==='snow'){spriteFx('fx_ice',p.x,p.y-p.arc,.3,.6,.35);sparks(p.x,p.y,6,'#bfe9ff');}
        else if(p.kind==='bullet'){sparks(p.x,p.y,5,'#ffd34d');}
        else sparks(p.x,p.y-p.arc,4,'#ddd');
        break;
      }
    }
  }else{
    const v=p.kind==='grain'?520:430;
    p.x-=v*dt;p.d+=v*dt;
    if(p.kind==='spore'){p.y+=60*dt;}
    if(p.x<GX0-200){p.dead=true;return;}
    for(const u of units){
      if(u.dying||u.under||u.away||u.row!==p.row)continue;
      if(Math.abs(p.x-u.x)<42){dmgUnit(u,p.kind==='grain'?9:13);p.dead=true;sparks(p.x,p.y,4,p.kind==='grain'?'#ffd34d':'#9cff5a');break;}
    }
  }
}

/* ---------- conejos: lógica ---------- */
function enemyInRange(u,cells,min){
  let best=null;
  for(const e of enemies){if(e.dead||e.row!==u.row)continue;
    if(e.x>u.x+(min||40)&&e.x<Math.min(W-10,u.x+cells*CWID)&&(!best||e.x<best.x))best=e;}
  return best;
}
function updUnit(u,dt,buf){
  const d=UD[u.k];
  if(u.dying){u.dt+=dt;return;}
  u.t+=dt;u.hitT=Math.max(0,u.hitT-dt);u.shake=Math.max(0,u.shake-dt);u.stun=Math.max(0,u.stun-dt);
  if(u.stun>0)return;
  const dtb=dt*buf; // aceleración del tambor
  if(u.k==='granjero'||u.k==='chef'){
    u.prodT-=dtb;
    if(u.st==='idle'&&u.prodT<=0){setState(u,u.k==='granjero'?'prod':'cook');}
    else if(u.st!=='idle'){
      const f=frameOf(d,u),at=u.k==='granjero'?1:3;
      if(u.ev<1&&f.fi>=at){u.ev=1;
        toks.push({kind:'basket',x:u.x+20,y:u.y-90,vx:rnd(25,55),vy:-340,ty:u.y-10,v:25,life:12,fly:0,rest:false});
        ring(u.x+10,u.y-80,50,'rgba(255,220,80,',.4);}
      if(f.done){setState(u,'idle');u.prodT=u.k==='granjero'?10:13;}
    }
  }else if(d.shots){
    u.cdT-=dtb;
    if(u.st==='idle'){if(u.cdT<=0&&enemyAt(u.row,u.x))setState(u,'attack');}
    else if(u.st==='attack'){
      const f=frameOf(d,u);
      while(u.ev<d.shots.length&&f.fi>=d.shots[u.ev].at){fireShot(u,d.shots[u.ev].kind);u.ev++;}
      if(f.done){setState(u,'idle');u.cdT=d.rate;}
    }
  }else if(u.k==='huevo'){
    if(u.t>=1.3)explodeEgg(u);
  }else if(u.k==='martillazo'){
    u.cdT-=dtb;
    if(u.st==='idle'){
      if(u.cdT<=0){const t=hammerTarget(u);if(t){u.tgtE=t;setState(u,'windup');}}
    }else if(u.st==='windup'){
      if(frameOf(d,u).done){setState(u,'throw');
        const t=u.tgtE&&!u.tgtE.dead?u.tgtE:hammerTarget(u);
        const tx=t?clamp(t.x-ED[t.k].sp_*CWID*.9,u.x+40,W-40):u.x+CWID*3;
        projs.push({own:true,kind:'hammer',row:u.row,x:u.x+60,sx:u.x+60,tx,y:u.y-90,t:0,T:Math.max(.55,Math.abs(tx-u.x)/620),dead:false,delay:0,rot:0,src:u});
      }
    }else if(u.st==='throw'){
      if(u.t>.35)setState(u,'rec');
    }else if(u.st==='rec'){
      if(frameOf(d,u).done){setState(u,'idle');u.cdT=.4;}
    }
  }else if(u.k==='francotirador'){
    u.cdT-=dtb;
    if(u.st==='idle'){if(u.cdT<=0){const t=topEnemy();if(t){u.tgtE=t;setState(u,'attack');}}}
    else{
      const f=frameOf(d,u);
      if(u.ev<1&&f.fi>=1){u.ev=1;const t=u.tgtE&&!u.tgtE.dead?u.tgtE:topEnemy();
        const mx=u.x+d.mz[0],my=u.y+d.mz[1];
        if(t){pushFx({k:'beam',x:mx,y:my,x2:t.x,y2:t.y-55,life:.18});dmgEnemy(t,ED[t.k].boss?150:260,true);sparks(t.x,t.y-55,8,'#ffd34d');}
        pushFx({k:'puff',x:mx,y:my,vx:10,vy:-20,r:10,col:'rgba(255,230,160,',life:.3});}
      if(f.done){setState(u,'idle');u.cdT=d.rate;}
    }
  }else if(u.k==='bombero'){
    const t=enemyInRange(u,4.6,20);
    if(t){
      if(u.st!=='spray')setState(u,'spray');
      u.sprayT=(u.sprayT||0)+dtb;
      if(u.sprayT>=.3){u.sprayT=0;
        for(const e of enemies){if(e.dead||e.row!==u.row||e.x<u.x||e.x>Math.min(W,u.x+4.6*CWID))continue;
          const hot=(e.k==='tomate'||e.k==='aji');
          dmgEnemy(e,hot?10:5,false,.8);
          if(e.k==='tomate'){e.wetT=8;if(e.st==='ignite')setState(e,'walk');}
          pushFx({k:'puff',x:e.x,y:e.y-50,vx:rnd(-30,30),vy:-40,r:7,col:'rgba(140,200,255,',life:.4});}
      }
    }else if(u.st!=='idle'){setState(u,'idle');}
  }else if(u.k==='abeja'){
    u.cdT-=dtb;
    if(u.st==='idle'){if(u.cdT<=0&&topEnemy())setState(u,'attack');}
    else{
      if(u.ev<1&&u.t>.1){u.ev=1;const t=topEnemy();
        if(t)for(let i=0;i<2;i++)projs.push({own:true,kind:'bee',tg:t,row:u.row,x:u.x+20+i*14,y:u.y-100-i*12,ph:rnd(0,6),t:0,dead:false,delay:i*.15,rot:0});}
      if(u.t>.6){setState(u,'idle');u.cdT=d.rate;}
    }
  }else if(u.k==='cavador'){
    u.cdT-=dtb;
    if(u.st==='idle'){
      if(u.cdT<=0&&enemyInRange(u,2.6,-40)){setState(u,'dive');}
    }else if(u.st==='dive'){
      if(frameOf(d,u).done){setState(u,'under');u.under=true;puff(u.x,u.y,6,'rgba(120,80,40,',30);}
    }else if(u.st==='under'){
      for(const e of enemies){if(e.dead||e.row!==u.row)continue;
        if(e.x>u.x-20&&e.x<u.x+120){
          u.under=false;setState(u,'pop');puff(u.x+30,u.y,10,'rgba(120,80,40,',40);shake(.2);
          for(const e2 of enemies){if(e2.dead||e2.row!==u.row)continue;
            if(e2.x>u.x-40&&e2.x<u.x+170){dmgEnemy(e2,ED[e2.k].boss?120:230,false);e2.x+=40;e2.rootT=Math.max(e2.rootT,1);}}
          break;}
      }
    }else if(u.st==='pop'){
      if(frameOf(d,u).done){setState(u,'idle');u.cdT=d.cd*.6;}
    }
  }else if(u.k==='ingeniero'){
    u.prodT-=dtb;
    if(u.st==='idle'){if(u.prodT<=0&&traps.filter(t=>t.src===u).length<2&&u.col<COLS-2)setState(u,'plant');}
    else{
      const f=frameOf(d,u);
      if(u.ev<1&&f.fi>=3){u.ev=1;const c=Math.min(COLS-1,u.col+1+Math.floor(rnd(1,3)));
        traps.push({row:u.row,x:colX(c),src:u,hits:3,t:0});puff(colX(c),u.y,5,'rgba(120,80,40,',20);}
      if(f.done){setState(u,'idle');u.prodT=14;}
    }
  }else if(u.k==='ninja'){
    u.cdT-=dtb;
    if(u.st==='idle'){
      if(u.cdT<=0){const t=enemyInRange(u,5,60);if(t&&!ED[t.k].boss||t){u.tgtE=t;u.hx=u.x;u.ex=Math.min(W-40,t.x+75);u.away=true;setState(u,'leap');}}
    }else if(u.st==='leap'){
      const k=clamp(u.t/.35,0,1);u.ox=(u.ex-u.hx)*k;u.oy=-Math.sin(k*Math.PI)*90;
      if(k>=1){setState(u,'slash');u.flip=true;u.oy=0;
        const t=u.tgtE;if(t&&!t.dead){dmgEnemy(t,ED[t.k].boss?100:130,false);sparks(t.x,t.y-50,10,'#fff');spriteFx('fx_puff',t.x,t.y-50,.3,.6,.3);}
        else{const t2=enemyInRange({row:u.row,x:u.ex-200},3,0);if(t2)dmgEnemy(t2,130,false);}}
    }else if(u.st==='slash'){
      if(u.t>.25){setState(u,'back');u.flip=false;}
    }else if(u.st==='back'){
      const k=clamp(u.t/.35,0,1);u.ox=(u.ex-u.hx)*(1-k);u.oy=-Math.sin(k*Math.PI)*90;
      if(k>=1){setState(u,'idle');u.ox=0;u.oy=0;u.away=false;u.cdT=d.cd*.45;}
    }
  }
}
function hammerTarget(u){
  let best=null;
  for(const e of enemies){if(e.dead||e.row!==u.row)continue;
    if(e.x>u.x+40&&e.x<Math.min(W-30,u.x+UD.martillazo.range*CWID+60)&&(!best||e.x<best.x))best=e;}
  return best;
}
function explodeEgg(u){
  const cx=u.x,cy=u.y-60;
  spriteFx('huevo_06',cx,u.y+12,.55,1.2,.6);
  spriteFx('huevo_05',cx,cy,.8,1.8,.4);
  spriteFx('huevo_07',cx,cy-20,.7,1.4,.8);
  ring(cx,u.y,150,'rgba(255,200,60,',.5);shake(.35);
  for(const e of enemies){
    if(e.dead)continue;
    const dx=e.x-cx,dy=(e.row-u.row)*RH;
    if(Math.hypot(dx,dy)<CWID*1.55)dmgEnemy(e,e.k==='zapallo'?260:1000,false);
  }
  u.dying=true;u.dt=0;u.egg=true;grid[u.row][u.col]=null;
}
function updHammer(p,dt){
  p.t+=dt;const k=clamp(p.t/p.T,0,1);
  p.x=p.sx+(p.tx-p.sx)*k;
  p.y=(p.src.y-90)*(1-k)+(rowY(p.row)-20)*k-Math.sin(k*Math.PI)*260;
  p.rot=k*Math.PI*3.2;
  if(k>=1){
    p.dead=true;
    spriteFx('huevo_06',p.tx,rowY(p.row)+6,.25,.55,.35);
    puff(p.tx,rowY(p.row),9,'rgba(140,100,60,',50);ring(p.tx,rowY(p.row),95,'rgba(255,230,160,',.35);shake(.22);
    for(const e of enemies){if(e.dead||e.row!==p.row)continue;
      if(Math.abs(e.x-p.tx)<ED[e.k].hw+78)dmgEnemy(e,e.k==='zapallo'?240:190,false);}
  }
}
function updTraps(dt){
  traps.forEach(t=>{
    t.t+=dt;
    for(const e of enemies){
      if(e.dead||e.row!==t.row||ED[e.k].fly||ED[e.k].boss)continue;
      if(Math.abs(e.x-t.x)<ED[e.k].hw+10&&!(e.trapT>0)){
        dmgEnemy(e,95,false);e.rootT=2.2;e.trapT=2.5;t.hits--;sparks(t.x,t.y||rowY(t.row),8,'#e5e9ef');
        if(t.hits<=0)break;
      }
    }
  });
  traps=traps.filter(t=>t.hits>0&&units.includes(t.src));
}

/* ---------- vegetales: lógica ---------- */
function updEnemy(e,dt){
  const d=ED[e.k];
  if(e.dead){e.dt+=dt;e.t+=dt;if(e.dt>d.deathTime)e.remove=true;return;}
  e.t+=dt;e.hitT=Math.max(0,e.hitT-dt);e.slowT=Math.max(0,e.slowT-dt);e.rootT=Math.max(0,e.rootT-dt);e.trapT=Math.max(0,(e.trapT||0)-dt);e.wetT=Math.max(0,e.wetT-dt);e.cdA-=dt;e.cdB-=dt;
  e.y+=(rowY(e.row)-e.y)*Math.min(1,dt*6);
  let spd=d.sp_*CWID*(e.slowT>0?.5:1)*(e.rootT>0?0:1);
  const meleeTarget=d.reach>0&&!d.fly?frontUnit(e,d.reach):null;
  /* espantapájaros: atrae a los vegetales de filas vecinas */
  if(!d.boss&&!d.fly&&!e.taunted&&e.x<W-60)for(const u of units){
    if(u.k!=='espantapajaros'||u.dying||Math.abs(u.row-e.row)!==1)continue;
    if(e.x>u.x&&e.x-u.x<CWID*3){e.row=u.row;e.taunted=true;puff(e.x,e.y-40,4,'rgba(255,220,120,',14);break;}
  }
  if(e.k==='choclo'){
    const tg=e.x<1560?unitAhead(e,d.range):null;
    if(e.st==='attack'){
      const f=frameOf(d,e);
      if(e.ev<1&&f.fi>=3){e.ev=1;enemyShot(e,'grain',0);enemyShot(e,'grain',.13);enemyShot(e,'grain',.26);}
      if(f.done){setState(e,'idle');e.cdA=2.6;}
      return;
    }
    if(tg){if(e.st!=='idle')setState(e,'idle');if(e.cdA<=0)setState(e,'attack');return;}
    if(e.st!=='walk')setState(e,'walk');
    e.x-=spd*dt;
  }
  else if(e.k==='lechuga'){
    const tg=e.x<1560?unitAhead(e,d.range):null;
    if(e.st==='attack'){
      if(e.ev<1&&e.t>.4){e.ev=1;enemyShot(e,'spore',0);enemyShot(e,'spore',.16);enemyShot(e,'spore',.32);}
      if(e.t>1.1){setState(e,'walk');e.cdA=4;}
      return;
    }
    if(tg&&e.cdA<=0)setState(e,'attack');
    else{if(e.st!=='walk')setState(e,'walk');e.x-=spd*dt;}
  }
  else if(e.k==='cebolla'){
    const near=unitAhead(e,d.gasRange);
    if(e.st==='special'){
      if(e.ev<1&&e.t>1.0){e.ev=1;fxGas(e.x-30,e.y,e.row);}
      if(e.t>1.3){setState(e,'idle');e.cdB=5;}
      return;
    }
    if(near||meleeTarget){
      if(e.st!=='idle')setState(e,'idle');
      if(e.cdB<=0)setState(e,'special');
      return;
    }
    if(e.st!=='walk')setState(e,'walk');
    e.x-=spd*dt;
  }
  else if(e.k==='tomate'){
    if(e.st==='ignite'){
      if(e.t>.6)explodeTomato(e);
      return;
    }
    if(meleeTarget){
      if(e.wetT>0){dmgUnit(meleeTarget,25);puff(e.x,e.y-30,6,'rgba(140,200,255,',20);killEnemy(e);return;}
      setState(e,'ignite');return;}
    e.spdMul=1+clamp((W+70-e.x)/(CWID*7),0,1.2);
    e.x-=spd*e.spdMul*dt;
  }
  else if(e.k==='aji'){
    if(meleeTarget){
      if(e.st!=='attack')setState(e,'attack');
      const an=d.anim.attack,n=an.f.length,p=e.t*an.fps;
      if(e.nextHit===undefined)e.nextHit=d.hitIdx;
      if(p>=e.nextHit){dmgUnit(meleeTarget,d.dmg);e.nextHit+=n;e.x+=18;}
    }else{
      e.dash-=dt;
      if(e.dash<=0&&e.cdB<=0){e.dash=.8;e.cdB=rnd(3.5,5.5);setState(e,'dash');}
      if(e.dash>0){e.x-=spd*2.5*dt;}
      else{if(e.st!=='walk')setState(e,'walk');e.x-=spd*dt;}
    }
  }
  else if(e.k==='brocoli'){
    if(e.st==='special'){
      if(e.ev<1&&e.t>.7){e.ev=1;shockwave(e,2.3,45,2);}
      if(e.t>1.3){setState(e,'walk');e.cdB=10;}
      return;
    }
    if(meleeTarget){
      if(e.cdB<=0){setState(e,'special');return;}
      if(e.st!=='attack')setState(e,'attack');
      const an=d.anim.attack,n=an.f.length,p=e.t*an.fps;
      if(e.nextHit===undefined)e.nextHit=d.hitIdx;
      if(p>=e.nextHit){dmgUnit(meleeTarget,d.dmg);e.nextHit+=n;puff(meleeTarget.x+30,e.y,4,'rgba(130,100,60,',22);shake(.1);}
    }else{if(e.st!=='walk')setState(e,'walk');e.x-=spd*dt;}
  }
  else if(e.k==='zapallo'){bossAI(e,dt,spd,meleeTarget);}
  else{
    if(meleeTarget){
      if(e.st!=='attack')setState(e,'attack');
      const an=d.anim.attack,n=an.f.length,p=e.t*an.fps;
      if(e.nextHit===undefined)e.nextHit=d.hitIdx;
      if(p>=e.nextHit){dmgUnit(meleeTarget,d.dmg);e.nextHit+=n;if(e.k==='beterraga')e.x+=12;}
    }else{if(e.st!=='walk')setState(e,'walk');e.x-=spd*dt;}
  }
  const w=wire[e.row];
  if(e.x-d.hw*.6<GX0-10&&w.st==='idle'){w.st='roll';say('¡Bola de alambre!',1.2);}
  if(e.x<165&&S==='play'){S='lose';lockUntil=Date.now()+700;silence();}
}
function fxGas(x,y,row){fxs.push({k:'gas',x,y,t:0,life:4.2,row,done:0});}
function explodeTomato(e){
  e.dead=true;e.dt=0;e.t=0;e.st='death';e.exploded=true;kills++;
  const cx=e.x,cy=e.y-40;
  spriteFx('huevo_06',cx,e.y+10,.4,.9,.5);spriteFx('huevo_05',cx,cy,.6,1.4,.4);ring(cx,e.y,140,'rgba(255,90,50,',.45);shake(.3);
  for(const u of units){
    if(u.dying)continue;
    if(Math.hypot(u.x-cx,(u.row-e.row)*RH)<CWID*1.3)dmgUnit(u,190);
  }
}
function shockwave(e,cells,dmg,stun){
  const cx=e.x-40;
  ring(cx,e.y,cells*CWID*.8,'rgba(255,240,180,',.6);ring(cx,e.y,cells*CWID*.5,'rgba(255,180,90,',.45);puff(cx,e.y,10,'rgba(150,110,60,',70);shake(.4);
  for(const u of units){
    if(u.dying)continue;
    if(Math.abs(u.row-e.row)<=1&&Math.abs(u.x-cx)<cells*CWID){dmgUnit(u,dmg);u.stun=Math.max(u.stun,stun);}
  }
}
function bossAI(e,dt,spd,tgt){
  const d=ED.zapallo;const rage=e.hp<d.hp*.5;
  if(rage&&e.phase===1){e.phase=2;say('¡REY ZAPALLO ENFURECIDO!',3);shake(.6);e.cdA=1.2;}
  const sp=spd*(rage?1.6:1),cd=rage?3:5;
  if(e.st==='attack'){
    if(e.ev<1&&e.t>.55){e.ev=1;shockwave(e,2.6,110,1.6);}
    if(e.t>1.1){setState(e,'walk');e.cdB=rage?1.6:2.4;}return;
  }
  if(e.st==='spores'){
    if(e.ev<1&&e.t>.6){e.ev=1;spriteFx('zapallo_02',e.x-70,e.y-70,.4,1.2,.5);
      const n=rage?7:4;for(let i=0;i<n;i++){fallSpore(colX(Math.floor(rnd(0,COLS-.01))),rowY(Math.floor(rnd(0,ROWS))));}}
    if(e.t>1.3){setState(e,'walk');e.cdA=cd;}return;
  }
  if(e.st==='summon'){
    if(e.ev<1&&e.t>.8){e.ev=1;
      const pool=['papa','aji','choclo','beterraga','tomate'];const n=rage?3:2;
      for(let i=0;i<n;i++){const k=pool[Math.floor(Math.random()*pool.length)];const row=clamp(e.row+Math.floor(rnd(-2,3)),0,ROWS-1);
        const s=spawnEnemy(k,row,e.x-rnd(20,160));s.cdA=2;puff(s.x,s.y-30,6,'rgba(110,230,70,',30);}
      ring(e.x-40,e.y,170,'rgba(110,255,80,',.6);}
    if(e.t>1.6){setState(e,'walk');e.cdA=cd+1;}return;
  }
  if(tgt&&e.cdB<=0){setState(e,'attack');return;}
  if(e.cdA<=0){setState(e,Math.random()<.5?'spores':'summon');return;}
  if(e.st!=='walk')setState(e,'walk');
  if(!tgt)e.x-=sp*dt;
}

/* ---------- oleadas ---------- */
function updWaves(dt){
  if(tut&&tut.step<5)return;
  TG+=dt;const lv=L();
  WV.skyT-=dt;
  WV.q=WV.q.filter(o=>{if(TG>=o.at){spawnEnemy(o.k);return false;}return true;});
  if(WV.skyT<=0){WV.skyT=rnd(7.5,10.5);toks.push({kind:'sky',x:rnd(GX0+60,COLE[COLS]-60),y:-40,ty:rnd(GTOP+90,ROWE[ROWS]-60),v:25,life:13,fly:0});}
  if(WV.boss){
    WV.next-=dt;
    if(WV.next<=0&&WV.bossRef&&!WV.bossRef.dead){spawnEnemy(['papa','aji','choclo'][Math.floor(Math.random()*3)]);WV.next=15;}
    return;
  }
  if(TG<lv.dur){
    WV.next-=dt;
    if(WV.next<=0){spawnEnemy(lv.pool[Math.floor(Math.random()*lv.pool.length)]);
      const k=clamp(TG/lv.dur,0,1);WV.next=(lv.int[0]+(lv.int[1]-lv.int[0])*k)*rnd(.8,1.2);}
    lv.waves.forEach((w,i)=>{if(!WV.wv[i]&&TG>=w[0]*lv.dur){WV.wv[i]=true;say('¡OLEADA GRANDE!',3);shake(.3);w[1].forEach((k,j)=>WV.q.push({at:TG+j*.7,k}));}});
  }else if(lv.boss){
    WV.boss=true;WV.bossRef=spawnEnemy('zapallo',2);say('¡LLEGA EL REY ZAPALLO!',4);shake(.8);WV.next=9;
  }else if(!WV.done&&WV.q.length===0&&!enemies.some(e=>!e.dead)){WV.done=true;winLevel();}
}
function winLevel(){
  const first=LVN===prog.won;
  S='win';lockUntil=Date.now()+700;S='win';
  g_unlock=null;
  if(first){prog.won=Math.min(NLV,prog.won+1);if(LVN<NLV-1&&2+LVN+1<ORDER.length)g_unlock=ORDER[3+LVN];save();}
  if(g_unlock){S='unlock';speak('¡Nuevo conejo desbloqueado! '+UD[g_unlock].name+'. '+UD[g_unlock].desc);}
  else if(LVN===NLV-1)speak('¡Felicitaciones! Derrotaste al Rey Zapallo y salvaste el huerto.');
}
let g_unlock=null;

/* ---------- bola de alambre ---------- */
function updWire(dt){
  wire.forEach((w,r)=>{
    if(w.st!=='roll')return;
    const sp=640;w.x+=sp*dt;w.rot+=sp*dt/46;
    for(const e of enemies){
      if(e.dead||e.row!==r||w.hit.has(e))continue;
      if(Math.abs(e.x-w.x)<ED[e.k].hw+55){
        w.hit.add(e);
        dmgEnemy(e,ED[e.k].boss?900:99999,false);
        sparks(w.x+40,e.y-40,9,'#e4e8f0');shake(.15);
      }
    }
    if(w.x>W+120)w.st='gone';
  });
}

const CARD={y0:6,h:112};
function cardGeom(){
  const n=cardsList().length;const cw=clamp(Math.floor(1290/n)-5,76,126);
  return {cw,gap:5,x0:166};
}
function cardRect(i){const q=cardGeom();return {x:q.x0+i*(q.cw+q.gap),y:CARD.y0,w:q.cw,h:CARD.h};}
function pointer(x,y){
  if(S==='loading')return;
  if((S==='win'||S==='lose'||S==='unlock')&&Date.now()<lockUntil)return;
  for(let i=UI.length-1;i>=0;i--){const b=UI[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return;}}
  if(S!=='play')return;
  for(let i=toks.length-1;i>=0;i--){
    const t=toks[i];if(t.fly)continue;
    if(Math.hypot(x-t.x,y-t.y)<52){t.fly=.001;t.fx=t.x;t.fy=t.y;return;}
  }
  const n=cardsList().length;
  for(let i=0;i<n;i++){
    const r=cardRect(i);
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){
      const d=UD[ORDER[i]];
      if(cds[i]<=0&&carrots>=d.cost)sel=(sel===i?null:i);else if(sel===i)sel=null;
      return;
    }
  }
  const c=cellAt(x,y);
  if(sel!==null&&c){if(place(sel,c.r,c.c))tutUpdate();}
  sel=null;
}
C.addEventListener('pointerdown',e=>{e.preventDefault();const p=toL(e);mouse=p;pointer(p.x,p.y);});
C.addEventListener('pointermove',e=>{mouse=toL(e);});
function toL(e){const r=C.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
window.addEventListener('keydown',e=>{

});

/* ---------- update ---------- */
function update(dt){
  if(S==='menu'||S==='loading'||S==='levels'||S==='alm'||S==='brief'||S==='unlock'||S==='win'||S==='lose'){TG+=dt;if(fxs)fxs.forEach(f=>f.t+=dt);return;}
  if(S!=='play')return;
  cds=cds.map(c=>Math.max(0,c-dt));
  if(bannerT>0)bannerT-=dt;
  if(shakeT>0)shakeT-=dt;
  if(tut)tut.t+=dt;
  updWaves(dt);
  const buf=[1,1,1,1,1];
  for(const u of units)if(u.k==='tambor'&&!u.dying)for(let r=Math.max(0,u.row-1);r<=Math.min(ROWS-1,u.row+1);r++)buf[r]=1.6;
  units.forEach(u=>updUnit(u,dt,buf[u.row]));
  enemies.forEach(e=>updEnemy(e,dt));
  projs.forEach(p=>p.kind==='hammer'?updHammer(p,dt):updProj(p,dt));
  updTraps(dt);updWire(dt);
  toks.forEach(t=>{
    t.life-=dt;
    if(t.fly){
      t.fly+=dt*2.2;const k=clamp(t.fly,0,1),e=k*k*(3-2*k);
      t.x=t.fx+(82-t.fx)*e;t.y=t.fy+(60-t.fy)*e;
      if(k>=1){carrots+=t.v;collected++;t.done=true;tutUpdate();}
    }else if(t.kind==='basket'){
      t.vy=(t.vy||0)+900*dt;t.x+=(t.vx||0)*dt;t.y+=t.vy*dt;
      if(t.y>=t.ty&&t.vy>0){t.y=t.ty;t.vy=0;t.vx=0;}
    }else{
      if(t.y<t.ty)t.y=Math.min(t.ty,t.y+90*dt);
    }
  });
  toks=toks.filter(t=>!t.done&&(t.fly||t.life>0));
  fxs.forEach(f=>{
    f.t+=dt;
    if(f.k==='gas'){
      f.done+=dt;
      if(f.done>=.5){f.done=0;
        for(const u of units){if(u.dying)continue;
          if(Math.abs(u.row-f.row)<=1&&Math.abs(u.x-f.x)<CWID*1.5)dmgUnit(u,7);}
      }
    }else if(f.k==='puff'||f.k==='spark'||f.k==='debris'||(f.k==='sprite'&&f.vx!==undefined)){
      f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt;
      if(f.k==='spark'||f.k==='debris'||f.k==='sprite')f.vy=(f.vy||0)+700*dt;
    }else if(f.k==='text'){f.y-=40*dt;}
  });
  fxs=fxs.filter(f=>f.t<f.life);
  projs=projs.filter(p=>!p.dead);
  units=units.filter(u=>!(u.dying&&u.dt>.01));
  enemies=enemies.filter(e=>!e.remove);
  if(WV.boss&&WV.bossRef&&WV.bossRef.dead&&WV.bossRef.dt>2.4&&S==='play'&&!WV.done){WV.done=true;winLevel();}
}

/* ============================ DIBUJO ============================ */
function hpBar(x,y,k){
  g.fillStyle='rgba(0,0,0,.55)';rr(x-24,y,48,8,4);g.fill();
  g.fillStyle=k>.5?'#69db4f':k>.25?'#f5c93b':'#ef4a3a';rr(x-23,y+1,Math.max(2,46*k),6,3);g.fill();
}
function drawUnit(u){
  const d=UD[u.k];
  if(u.dying)return;
  let name,fr;
  if(u.k==='jaula'){const idx=Math.min(5,Math.floor((1-u.hp/u.max)*6));name=nm('jaula',idx);}
  else{fr=frameOf(d,u);name=fr.name;}
  let ox=u.ox||0,oy=u.oy||0;
  if(u.shake>0)ox+=(Math.random()-.5)*7;
  if(u.k==='huevo')ox+=(Math.random()-.5)*(2+u.t*5);
  shadow(u.x+(u.ox||0),u.y,u.k==='jaula'?58:46);
  let tint=null;
  if(u.hitT>0)tint=['#ffffff',.5];
  else if(u.stun>0)tint=['#9aa6ff',.35];
  else if(u.k==='huevo'&&u.t>.5&&Math.floor(u.t*14)%2)tint=['#ff5a3a',.5];
  spr(name,u.x+ox,u.y+oy,d.sc,{tint,flip:u.flip});
  if(u.k==='granjero'&&u.prodT<1&&u.st==='idle'){
    g.save();g.globalAlpha=.4*(1-u.prodT);g.fillStyle='#ffe066';g.beginPath();g.arc(u.x-10,u.y-80,36,0,7);g.fill();g.restore();
  }
  if(u.hp<u.max&&!u.under)hpBar(u.x+(u.ox||0),u.y-(d.fit[1]+8)+oy,u.hp/u.max);
  if(u.stun>0)txt('✦',u.x,u.y-d.fit[1]-12,28,'#c6d0ff');
}
function drawEnemy(e){
  const d=ED[e.k];
  let y=e.y,x=e.x;
  if(e.dead){
    if(e.exploded)return;
    const fadeStart=d.deathTime*.55;
    const a=clamp(1-(e.dt-fadeStart)/(d.deathTime-fadeStart),0,1);
    shadow(x,y,40*d.sc*.8);
    if(d.anim.death){const fr=frameOf(d,{st:'death',t:e.dt});spr(fr.name,x,y,d.sc,{a});}
    else spr(nm(d.sp,d.anim.walk.f[0]),x,y,d.sc,{a});
    return;
  }
  const fr=frameOf(d,e);
  const bob=Math.sin(TG*8+e.seed)*(d.fly?7:2);
  let off=0;
  if(d.fly){off=-62;shadow(x,y,34*d.sc*.8);}
  else shadow(x,y,(d.boss?110:d.sc*30)+(e.k==='tomate'?8:0));
  let tint=null;
  if(e.hitT>0)tint=['#ffffff',.55];
  else if(e.slowT>0||e.wetT>0)tint=['#7fd0ff',.38];
  else if(e.k==='zapallo'&&e.phase===2)tint=['#ff3b2a',.22+.12*Math.sin(TG*9)];
  else if(e.st==='ignite'&&Math.floor(e.t*16)%2)tint=['#ffe14d',.5];
  spr(fr.name,x,y+bob+off,d.sc,{tint});
  if(e.slowT>0)spr('fx_ice',x,y+6,.3,{a:.7});
  if(e.rootT>0){g.strokeStyle='#cfd6e2';g.lineWidth=3;for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(x+i*18-6,y+4);g.lineTo(x+i*18,y-16);g.lineTo(x+i*18+6,y+4);g.stroke();}}
  if(e.hp<e.max)hpBar(x,y-(d.boss?260:d.sc*86)-(d.fly?60:0),e.hp/e.max);
}
function drawProj(p){
  if(p.delay>0)return;
  if(p.kind==='hammer'){spr('martillazo_04',p.x,p.y,.62,{rot:p.rot});return;}
  if(p.kind==='fall'){spr('lechuga_06',p.x,p.y,1.2,{a:.95});return;}
  if(p.kind==='bee'){spr('abeja_06',p.x,p.y+Math.sin(p.t*30)*3,.3,{flip:p.tg&&p.tg.x<p.x?false:true});return;}
  if(p.own){
    const d=PJ[p.kind];shadow(p.x,rowY(p.row)-6,12);
    spr(d.sp,p.x,p.y-(p.arc||0),d.sc,{rot:p.rot});
  }else{
    if(p.kind==='grain')spr(p.d%40<20?'choclo_03':'choclo_04',p.x,p.y,1.7);
    else spr('lechuga_0'+(2+Math.floor(p.d/30)%3),p.x,p.y,.9);
  }
}
function drawFx(f){
  const k=f.t/f.life;
  if(f.k==='ring'){g.strokeStyle=f.col+(1-k)+')';g.lineWidth=10*(1-k)+2;g.beginPath();g.ellipse(f.x,f.y,f.r*k,f.r*k*.4,0,0,7);g.stroke();}
  else if(f.k==='puff'){g.fillStyle=f.col+(.5*(1-k))+')';g.beginPath();g.arc(f.x,f.y,f.r*(1+k),0,7);g.fill();}
  else if(f.k==='spark'){g.fillStyle=f.col;g.globalAlpha=1-k;g.beginPath();g.arc(f.x,f.y,3.2,0,7);g.fill();g.globalAlpha=1;}
  else if(f.k==='sprite'){spr(f.name,f.x,f.y,f.s0+(f.s1-f.s0)*k,{a:1-k*k,rot:f.rot*k});}
  else if(f.k==='debris'){spr(f.name,f.x,f.y,.8,{a:1-k*k,rot:f.rot*f.t});}
  else if(f.k==='beam'){g.save();g.globalAlpha=1-k;g.strokeStyle='#fff6b0';g.lineWidth=5;g.beginPath();g.moveTo(f.x,f.y);g.lineTo(f.x2,f.y2);g.stroke();g.strokeStyle='#ffb020';g.lineWidth=2;g.stroke();g.restore();}
  else if(f.k==='text'){g.save();g.globalAlpha=1-k*k;txt(f.s,f.x,f.y,34,f.col,'center','#3a2205');g.restore();}
  else if(f.k==='mark'){g.strokeStyle='rgba(120,255,60,'+(.8*(1-k*.5))+')';g.lineWidth=5;g.beginPath();g.ellipse(f.x,f.y,48*(1-k*.4),19*(1-k*.4),0,0,7);g.stroke();}
  else if(f.k==='gas'){
    const a=Math.min(1,f.t*2.5)*Math.min(1,(f.life-f.t)*1.2);
    for(let i=0;i<7;i++){
      const ang=i*1.1+f.t*.8,rx=Math.cos(ang)*CWID*.8*(i%3)/2.2,ry=Math.sin(ang)*30;
      g.fillStyle='rgba(130,225,40,'+(.28*a)+')';g.beginPath();g.ellipse(f.x+rx,f.y-45+ry,74,48,0,0,7);g.fill();
    }
    spr('cebolla_02',f.x+Math.sin(f.t*3)*20,f.y-55,2.6,{a:.55*a});
  }
}
function drawTok(t){
  const a=t.fly?1:(t.life<3?(.55+.45*Math.sin(t.life*10)):1);
  g.save();g.globalAlpha=.35*a;g.fillStyle='#fff3a0';g.beginPath();g.arc(t.x,t.y-4,40+Math.sin(TG*6+t.x)*3,0,7);g.fill();g.restore();
  spr('granjero_03',t.x,t.y+4,.3,{a,rot:Math.sin(TG*3+t.x)*.25});
}
function drawWire(){

    b.addEventListener('click',e=>{e.stopPropagation();o.style.display='flex';});
    b.addEventListener('pointerdown',e=>e.stopPropagation());
    document.getElementById('iosx').addEventListener('click',()=>{o.style.display='none';});
    return;
  }
  const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  function toggle(){
    try{
      if(!isFS()){
        const p=req.call(el);
        const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(e){}};
        if(p&&p.then)p.then(lock).catch(()=>{});else lock();
      }else{ex.call(document);}
    }catch(e){}
  }
  function upd(){b.textContent=isFS()?'✕':'⛶';}
  b.addEventListener('click',e=>{e.stopPropagation();toggle();});
  b.addEventListener('pointerdown',e=>e.stopPropagation());
  document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd);
  addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')toggle();});
})();

</script>
</body>
</html>
